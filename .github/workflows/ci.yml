name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml selects the toolchain and components.
      - name: Show toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      # TST-1 / TST-8: all warnings, including missing documentation, are errors.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # MGN-4 / TST-1: the full perft suite is too slow for a debug build, so
      # it is marked ignored and run here, optimised, on both CPU tiers.
      - name: Perft suite (generic)
        run: cargo test --workspace --release -- --include-ignored

      - name: Clippy and perft suite (v3)
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --target-dir target/v3 -- -D warnings
          cargo test --workspace --release --target-dir target/v3 -- --include-ignored
        env:
          RUSTFLAGS: -Ctarget-cpu=x86-64-v3

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      # BLD-2: both release tiers must build and run.
      - name: Build v3
        run: cargo v3

      - name: Build generic
        run: cargo generic

      # PRN-6: both tiers must search exactly the same tree.
      - name: Bench
        shell: bash
        run: |
          v3=$(./target/v3/release/postmark bench | tail -n 1)
          generic=$(./target/generic/release/postmark bench | tail -n 1)
          echo "v3:      $v3"
          echo "generic: $generic"
          test "${v3%% *}" = "${generic%% *}"
